# Server Port (Render passes dynamic PORT env var)
server.port=${PORT:8080}

# Application Name
spring.application.name=student-attendance-system

# Database Configuration:
# - If SPRING_DATASOURCE_URL is set to a valid database URL (e.g. jdbc:mysql://...), it connects to MySQL.
# - If left unset on Render, it automatically falls back to an embedded in-memory database in MySQL mode so deployment succeeds instantly without requiring an external DB setup!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:attendance_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Enabled for easy web inspection at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# CORS Allowed Origins
cors.allowed.origins=*
